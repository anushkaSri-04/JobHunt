# Skill dictionary. Format: "Display name": ["spelling", "spelling", ...]
# - List EVERY spelling you want matched. The display name is NOT matched on its own.
# - All-lowercase spellings match case-insensitively.
# - A spelling with any capital letter matches ONLY that exact casing
#   (so "React" matches the library, not the verb "react").
# - Skip ambiguous words (go, r, c, swift, rest, excel): use a safer spelling instead.

